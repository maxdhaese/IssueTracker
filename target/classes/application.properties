spring.application.name=issuetracker

# ---------------------------------------
# DATABASE CONFIG
# ---------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/max
spring.datasource.username=max
spring.datasource.password=

# PostgreSQL dialect (JPA)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Don't let Hibernate create tables - Flyway will handle this
spring.jpa.hibernate.ddl-auto=validate

# Show SQL in console (optional for development)
spring.jpa.show-sql=true


# ---------------------------------------
# FLYWAY CONFIG
# ---------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.repair=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=baseline

logging.level.org.springframework.security=DEBUG

# ---------------------------------------
# SERVER
# ---------------------------------------
server.port=8080

# ---------------------------------------
# HIBERNATE NAMING STRATEGY (auto snake_case)
# ---------------------------------------
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl

# JWT
security.jwt.secret=change-me-to-a-long-random-secret-at-least-32-chars
security.jwt.issuer=issuetracker
security.jwt.expiration-minutes=60

