spring.application.name=issuetracker

# ---------------------------------------
# DATABASE CONFIG
# ---------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/max
spring.datasource.username=max
spring.datasource.password=

# PostgreSQL dialect (JPA)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Don't let Hibernate create tables - Flyway will handle this
spring.jpa.hibernate.ddl-auto=validate

# Show SQL in console (optional for development)
spring.jpa.show-sql=true


# ---------------------------------------
# FLYWAY CONFIG
# ---------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# ---------------------------------------
# SERVER
# ---------------------------------------
server.port=8080

# ---------------------------------------
# HIBERNATE NAMING STRATEGY (auto snake_case)
# ---------------------------------------
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl


